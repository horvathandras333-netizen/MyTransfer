<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · MyTransfer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  </head>
  <body>
    <main class="shell narrow">
      <header><a class="brand" href="{{ url_for('login') }}">MyTransfer</a><p>Sign in to manage your shared files.</p></header>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}
      {% endwith %}
      <section class="card login-card">
        <h1>Admin sign in</h1>
        <form action="{{ url_for('login') }}" method="post">
          <label class="password">Password<input type="password" name="password" autocomplete="current-password" required autofocus></label>
          <button type="submit">Sign in</button>
        </form>
      </section>
    </main>
  </body>
</html>
